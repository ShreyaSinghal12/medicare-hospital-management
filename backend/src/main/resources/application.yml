# =====================================================================
# MediCare backend configuration.
# Secrets are NEVER written here: they come from environment variables
# or from an optional backend/.env file (see .env.example).
# =====================================================================
spring:
  application:
    name: medicare-backend
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: dev

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/medicare_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useUnicode=true&characterEncoding=utf8}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only verifies it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        name: MEDICARE_SESSION
        http-only: true
        secure: ${COOKIE_SECURE:false}   # set true when served over HTTPS
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

medicare:
  version: 1.0.0
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  upload-dir: ${UPLOAD_DIR:./uploads}
  bootstrap:   # first administrator of a new installation (ignored once an administrator exists)
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-name: ${BOOTSTRAP_ADMIN_NAME:Administrator}
  mail:
    enabled: ${MAIL_ENABLED:false}       # false = in-app notifications only
    from: ${MAIL_FROM:no-reply@medicare.example}
    outbox-dir: ${MAIL_OUTBOX_DIR:}      # dev only: write e-mails to files when SMTP is disabled
  security:
    max-failed-logins: ${MAX_FAILED_LOGINS:5}
    lockout-minutes: ${LOCKOUT_MINUTES:15}
    login-requests-per-window: ${LOGIN_RATE_LIMIT:20}
    reset-requests-per-window: ${RESET_RATE_LIMIT:5}
    rate-limit-window-minutes: ${RATE_LIMIT_WINDOW_MINUTES:15}
    reset-token-minutes: ${RESET_TOKEN_MINUTES:30}
    account-setup-hours: ${ACCOUNT_SETUP_HOURS:72}

logging:
  level:
    root: INFO
    com.medicare: INFO
    org.hibernate.SQL: WARN

---
spring:
  config:
    activate:
      on-profile: dev
medicare:
  mail:
    outbox-dir: ${MAIL_OUTBOX_DIR:./mail-outbox}

---
# Optional fictional demo accounts: run with SPRING_PROFILES_ACTIVE=dev,demo
spring:
  config:
    activate:
      on-profile: demo
medicare:
  demo:
    password: ${DEMO_PASSWORD:}

---
spring:
  config:
    activate:
      on-profile: prod
medicare:
  mail:
    outbox-dir: ""

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
server:
  forward-headers-strategy: native   # behind the nginx reverse proxy: real client IP and https scheme
  servlet:
    session:
      cookie:
        secure: true
