# Integration tests run against a DEDICATED MySQL test database (never the dev DB).
# Override with TEST_DB_URL / TEST_DB_USERNAME / TEST_DB_PASSWORD environment variables.
spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:mysql://localhost:3306/medicare_test?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${TEST_DB_USERNAME:${DB_USERNAME}}
    password: ${TEST_DB_PASSWORD:${DB_PASSWORD}}
  flyway:
    clean-disabled: false

medicare:
  mail:
    enabled: false
  upload-dir: ./target/test-uploads

logging:
  level:
    com.medicare: WARN
